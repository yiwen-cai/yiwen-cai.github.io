<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400">
  <!-- 背景 -->
  <rect width="700" height="400" fill="#ffffff"/>
  <defs>
    <marker id="drift-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1971c2" />
    </marker>
    <marker id="noise-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59f00" />
    </marker>
    <marker id="total-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b8a3e" />
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="350" y="28" text-anchor="middle" font-size="17" font-weight="600" fill="#212529">
    Euler-Maruyama 单步分解：确定性漂移 + 随机扩散
  </text>

  <!-- 起点 X_t -->
  <circle cx="120" cy="290" r="8" fill="#212529" stroke="#ffffff" stroke-width="2.5"/>
  <text x="120" y="320" text-anchor="middle" font-size="15" font-weight="600" font-family="monospace" fill="#212529">X_t</text>
  <text x="120" y="338" text-anchor="middle" font-size="12" fill="#868e96">当前状态</text>

  <!-- 第一步：确定性漂移向量（蓝色实线） -->
  <line x1="120" y1="290" x2="352" y2="132" stroke="#1971c2" stroke-width="3.5" marker-end="url(#drift-v)"/>
  
  <!-- 漂移标签 -->
  <g transform="translate(130, 175)">
    <rect width="150" height="46" rx="7" fill="#e7f5ff" stroke="#74c0fc" stroke-width="1.8"/>
    <text x="75" y="20" text-anchor="middle" font-size="12" font-weight="600" fill="#1864ab">① 确定性漂移</text>
    <text x="75" y="37" text-anchor="middle" font-size="13" font-family="monospace" fill="#1971c2">h · u_t(X_t)</text>
  </g>

  <!-- 漂移预测点 -->
  <circle cx="360" cy="125" r="7" fill="#1971c2" stroke="#ffffff" stroke-width="2.5"/>
  <text x="360" y="105" text-anchor="middle" font-size="13" font-weight="600" font-family="monospace" fill="#1864ab">X_t + h·u_t</text>
  <text x="360" y="88" text-anchor="middle" font-size="11" fill="#868e96">（漂移预测点）</text>

  <!-- 第二步：随机扩散扰动（橙色虚线） -->
  <line x1="360" y1="125" x2="510" y2="215" stroke="#f59f00" stroke-width="3.5" stroke-dasharray="7,4" marker-end="url(#noise-v)"/>
  
  <!-- 扩散标签 -->
  <g transform="translate(400, 130)">
    <rect width="175" height="46" rx="7" fill="#fff9db" stroke="#ffd43b" stroke-width="1.8"/>
    <text x="87" y="20" text-anchor="middle" font-size="12" font-weight="600" fill="#e67700">② 随机扩散扰动</text>
    <text x="87" y="37" text-anchor="middle" font-size="13" font-family="monospace" fill="#f08c00">σ_t·√h·ϵ_t</text>
  </g>

  <!-- 随机扰动的其他可能方向（淡色示意） -->
  <line x1="360" y1="125" x2="440" y2="90" stroke="#ffd43b" stroke-width="1.8" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="360" y1="125" x2="475" y2="145" stroke="#ffd43b" stroke-width="1.8" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="360" y1="125" x2="400" y2="200" stroke="#ffd43b" stroke-width="1.8" stroke-dasharray="4,3" opacity="0.5"/>
  
  <text x="455" y="80" font-size="10" fill="#adb5bd" font-style="italic">（其他随机实现）</text>

  <!-- 最终采样点 -->
  <circle cx="518" cy="220" r="8" fill="#2b8a3e" stroke="#ffffff" stroke-width="2.5"/>
  <text x="540" y="218" font-size="15" font-weight="600" font-family="monospace" fill="#2b8a3e">X_{t+h}</text>
  <text x="540" y="236" font-size="11" fill="#868e96">最终采样点</text>

  <!-- 合成路径（绿色淡虚线） -->
  <line x1="120" y1="290" x2="510" y2="222" stroke="#2b8a3e" stroke-width="2" stroke-dasharray="5,4" opacity="0.45" marker-end="url(#total-v)"/>
  <text x="300" y="278" font-size="11" fill="#40c057" font-style="italic" opacity="0.9">等效合成位移</text>

  <!-- 底部公式卡片 -->
  <g transform="translate(90, 348)">
    <rect width="520" height="42" rx="8" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
    <text x="260" y="18" text-anchor="middle" font-size="13" font-weight="600" fill="#495057">完整更新公式</text>
    <text x="260" y="35" text-anchor="middle" font-size="13" font-family="monospace" fill="#212529">
      X_{t+h} = X_t + h·u_t(X_t) + σ_t·√h·ϵ_t，  ϵ_t ~ 𝒩(0, I_d)
    </text>
  </g>
</svg>
