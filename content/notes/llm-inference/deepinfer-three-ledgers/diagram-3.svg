<svg xmlns="http://www.w3.org/2000/svg" width="960" height="565" viewBox="0 0 960 565" role="img" aria-labelledby="title desc">
<title id="title">逻辑失效 ≠ 物理回收</title><desc id="desc">上方：允许重算时请求被抢占并回到 WAITING，旧输出不再记账；COMPLETION 不能套用此分支。下方是独立 clone 案例：拷贝在途期间保持 pin，事件完成后才解除。两轴并非同一次事件。</desc>
<rect x="0" y="0" width="960" height="565" rx="0" fill="#FAF9F5" stroke="none"/><text x="40" y="40" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#655F58" text-anchor="start">03  /  DEEPINFER</text><text x="40" y="80" font-family="Georgia, Songti SC, serif" font-size="29" fill="#141413" text-anchor="start">逻辑失效 ≠ 物理回收</text><text x="45" y="140" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#655F58" text-anchor="start">A  /  结果有效性</text><line x1="170" y1="205" x2="872" y2="205" stroke="#141413" stroke-width="1.5"/><line x1="190" y1="205" x2="454" y2="205" stroke="#788C5D" stroke-width="6"/><line x1="454" y1="205" x2="850" y2="205" stroke="#D8D2C8" stroke-width="4" stroke-dasharray="5 6"/><circle cx="190" cy="205" r="4" fill="#141413"/><text x="190" y="179" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#141413" text-anchor="middle">在途输出</text><circle cx="454" cy="205" r="4" fill="#D97757"/><text x="454" y="179" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#141413" text-anchor="middle">抢占重置</text><circle cx="850" cy="205" r="4" fill="#141413"/><text x="850" y="179" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#141413" text-anchor="middle">旧输出返回</text><text x="454" y="246" font-family="Georgia, Songti SC, serif" font-size="18" fill="#D97757" text-anchor="middle">WAITING</text><text x="850" y="246" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#655F58" text-anchor="middle">跳过记账</text><text x="170" y="287" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#655F58" text-anchor="start">适用：允许重算的分支；COMPLETION 被抢占须终止。</text><line x1="40" y1="322" x2="920" y2="322" stroke="#D8D2C8" stroke-width="1.5" stroke-dasharray="5 6"/><text x="45" y="369" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#655F58" text-anchor="start">B  /  独立 clone 路径</text><line x1="170" y1="434" x2="872" y2="434" stroke="#141413" stroke-width="1.5"/><line x1="190" y1="434" x2="690" y2="434" stroke="#D97757" stroke-width="6"/><circle cx="190" cy="434" r="4" fill="#141413"/><text x="190" y="408" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#141413" text-anchor="middle">持有 pin</text><circle cx="690" cy="434" r="4" fill="#141413"/><text x="690" y="408" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#141413" text-anchor="middle">事件完成</text><circle cx="850" cy="434" r="4" fill="#141413"/><text x="850" y="408" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#141413" text-anchor="middle">解除 pin</text><text x="430" y="475" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" fill="#141413" text-anchor="middle">异步使用期</text><text x="850" y="475" font-family="Georgia, Songti SC, serif" font-size="18" fill="#655F58" text-anchor="middle">unpin</text><text x="480" y="531" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" fill="#655F58" text-anchor="middle">结果是否有效，与资源是否仍被引用，是两个判断。</text></svg>