<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1180" width="640" height="1180">
  <!-- 背景 -->
  <rect width="640" height="1180" fill="#ffffff"/>
  
  <!-- 定义箭头 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1e1e1e" />
    </marker>
  </defs>
  
  <!-- 步骤 1: 真实对象 -->
  <rect x="220" y="50" width="200" height="80" rx="10" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
  <text x="320" y="80" text-anchor="middle" font-size="18" font-weight="600" fill="#1e1e1e">真实对象</text>
  <text x="320" y="105" text-anchor="middle" font-size="15" fill="#495057">图像 / 视频 / 分子 / 蛋白</text>
  
  <!-- 箭头 1 -->
  <line x1="320" y1="130" x2="320" y2="190" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="340" y="165" font-size="14" fill="#495057">数值化 + 展平</text>
  
  <!-- 步骤 2: 向量表示 -->
  <rect x="220" y="190" width="200" height="80" rx="10" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
  <text x="320" y="220" text-anchor="middle" font-size="18" font-weight="600" fill="#1e1e1e">向量表示</text>
  <text x="320" y="245" text-anchor="middle" font-size="16" fill="#495057">z ∈ ℝᵈ</text>
  
  <!-- 箭头 2 -->
  <line x1="320" y1="270" x2="320" y2="330" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="340" y="305" font-size="14" fill="#495057">假设存在底层分布</text>
  
  <!-- 步骤 3: 未知数据分布 -->
  <rect x="220" y="330" width="200" height="80" rx="10" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
  <text x="320" y="360" text-anchor="middle" font-size="18" font-weight="600" fill="#1e1e1e">未知数据分布</text>
  <text x="320" y="385" text-anchor="middle" font-size="16" fill="#495057">p_data</text>
  
  <!-- 箭头 3 -->
  <line x1="320" y1="410" x2="320" y2="470" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="340" y="445" font-size="14" fill="#495057">i.i.d. 有限采样</text>
  
  <!-- 步骤 4: 训练数据集 -->
  <rect x="220" y="470" width="200" height="80" rx="10" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
  <text x="320" y="500" text-anchor="middle" font-size="18" font-weight="600" fill="#1e1e1e">训练数据集</text>
  <text x="320" y="525" text-anchor="middle" font-size="16" fill="#495057">z₁, …, zₙ</text>
  
  <!-- 箭头 4 -->
  <line x1="320" y1="550" x2="320" y2="610" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="340" y="585" font-size="14" fill="#495057">训练（第 3、4 章）</text>
  
  <!-- 步骤 5: 生成模型 -->
  <rect x="220" y="610" width="200" height="80" rx="10" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/>
  <text x="320" y="655" text-anchor="middle" font-size="18" font-weight="600" fill="#1e1e1e">生成模型</text>
  
  <!-- 分支箭头 -->
  <path d="M 220 650 Q 130 750 130 860" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 420 650 Q 510 750 510 860" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 步骤 6a: 无条件生成 -->
  <rect x="30" y="860" width="200" height="90" rx="10" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
  <text x="130" y="890" text-anchor="middle" font-size="18" font-weight="600" fill="#1e1e1e">无条件生成</text>
  <text x="130" y="915" text-anchor="middle" font-size="16" fill="#495057">z ~ p_data</text>
  <text x="130" y="938" text-anchor="middle" font-size="13" fill="#868e96">（本课程第 3、4 章）</text>
  
  <!-- 条件 y -->
  <rect x="450" y="740" width="140" height="60" rx="10" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
  <text x="520" y="775" text-anchor="middle" font-size="16" font-weight="600" fill="#1e1e1e">条件 y</text>
  
  <!-- 条件箭头 -->
  <line x1="520" y1="800" x2="520" y2="860" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  
  <!-- 步骤 6b: 条件生成 -->
  <rect x="410" y="860" width="200" height="90" rx="10" fill="#c3fae8" stroke="#1e1e1e" stroke-width="2"/>
  <text x="510" y="890" text-anchor="middle" font-size="18" font-weight="600" fill="#1e1e1e">条件生成</text>
  <text x="510" y="915" text-anchor="middle" font-size="16" fill="#495057">z ~ p_data(·|y)</text>
  <text x="510" y="938" text-anchor="middle" font-size="13" fill="#868e96">（第 5 章 Guidance）</text>
</svg>
