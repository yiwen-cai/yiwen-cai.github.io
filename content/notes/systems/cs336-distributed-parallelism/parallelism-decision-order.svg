<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400">
  <!-- 背景 -->
  <rect width="700" height="400" fill="#ffffff"/>

  <defs>
    <marker id="dec-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#495057" />
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="350" y="28" text-anchor="middle" font-size="17" font-weight="600" fill="#212529">
    并行策略选择顺序：从硬约束到吞吐优化
  </text>

  <!-- 第一步 -->
  <g transform="translate(30, 48)">
    <rect width="640" height="104" rx="10" fill="#ffe3e3" stroke="#ffa8a8" stroke-width="2"/>
    <circle cx="30" cy="30" r="15" fill="#c92a2a"/>
    <text x="30" y="35" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
    <text x="56" y="28" font-size="14" font-weight="600" fill="#c92a2a">让模型放进内存</text>
    <text x="182" y="28" font-size="11" fill="#e03131">← 硬约束，装不下就跑不起来</text>

    <g transform="translate(56, 40)">
      <rect width="280" height="50" rx="6" fill="#ffffff" stroke="#ffc9c9" stroke-width="1.2"/>
      <text x="10" y="18" font-size="11" font-weight="600" fill="#1864ab">Tensor Parallelism</text>
      <text x="10" y="33" font-size="10" fill="#495057">先铺满单节点内 GPU（通常 TP=8）</text>
      <text x="10" y="45" font-size="9.5" fill="#868e96">依赖 NVLink 高带宽，跨节点会掉性能</text>
    </g>

    <g transform="translate(348, 40)">
      <rect width="272" height="50" rx="6" fill="#ffffff" stroke="#ffc9c9" stroke-width="1.2"/>
      <text x="10" y="18" font-size="11" font-weight="600" fill="#5f3dc4">FSDP (ZeRO-3) 或 Pipeline Parallelism</text>
      <text x="10" y="33" font-size="10" fill="#495057">跨节点扩展，直到模型能装下</text>
      <text x="10" y="45" font-size="9.5" fill="#868e96">FSDP 更灵活，PP 通信量更小</text>
    </g>
  </g>

  <line x1="350" y1="156" x2="350" y2="176" stroke="#495057" stroke-width="2" marker-end="url(#dec-arrow)"/>

  <!-- 第二步 -->
  <g transform="translate(30, 180)">
    <rect width="640" height="86" rx="10" fill="#e7f5ff" stroke="#74c0fc" stroke-width="2"/>
    <circle cx="30" cy="30" r="15" fill="#1971c2"/>
    <text x="30" y="35" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>
    <text x="56" y="28" font-size="14" font-weight="600" fill="#1864ab">用剩余 GPU 做 Data Parallelism</text>
    <text x="330" y="28" font-size="11" fill="#1971c2">← 放大吞吐</text>

    <g transform="translate(56, 40)">
      <rect width="564" height="34" rx="6" fill="#ffffff" stroke="#a5d8ff" stroke-width="1.2"/>
      <text x="10" y="15" font-size="10.5" fill="#495057">DP 的带宽要求最低，最灵活：每卡一份完整模型，只在梯度同步时通信一次</text>
      <text x="10" y="28" font-size="9.5" fill="#868e96">总卡数 = TP × PP × DP，先固定前两项，剩下的都给 DP</text>
    </g>
  </g>

  <line x1="350" y1="270" x2="350" y2="290" stroke="#495057" stroke-width="2" marker-end="url(#dec-arrow)"/>

  <!-- 第三步 -->
  <g transform="translate(30, 294)">
    <rect width="640" height="76" rx="10" fill="#e6fcf5" stroke="#63e6be" stroke-width="2"/>
    <circle cx="30" cy="28" r="15" fill="#099268"/>
    <text x="30" y="33" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>
    <text x="56" y="26" font-size="14" font-weight="600" fill="#087f5b">Gradient Accumulation</text>
    <text x="256" y="26" font-size="11" fill="#0ca678">← 可选：batch size 太小时</text>

    <g transform="translate(56, 36)">
      <rect width="564" height="30" rx="6" fill="#ffffff" stroke="#96f2d7" stroke-width="1.2"/>
      <text x="10" y="13" font-size="10.5" fill="#495057">多步累积后再同步梯度，等价于增大有效 batch size，同时摊薄通信开销</text>
      <text x="10" y="25" font-size="9.5" fill="#868e96">不增加显存中的激活值峰值，但会拉长单个 optimizer step 的时间</text>
    </g>
  </g>

  <!-- 底部提示 -->
  <text x="350" y="392" text-anchor="middle" font-size="10.5" fill="#868e96">
    顺序不能颠倒：先解决「能不能跑」，再解决「跑得快不快」
  </text>
</svg>
