<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360">
  <!-- 背景 -->
  <rect width="760" height="360" fill="#ffffff"/>

  <defs>
    <marker id="eq-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#495057" />
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="380" y="28" text-anchor="middle" font-size="17" font-weight="600" fill="#212529">
    All-Reduce = Reduce-Scatter + All-Gather
  </text>

  <!-- 左侧：All-Reduce 一步到位 -->
  <g transform="translate(30, 55)">
    <rect width="320" height="250" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/>
    <text x="160" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#495057">All-Reduce（一步到位）</text>

    <!-- 输入状态 -->
    <text x="16" y="50" font-size="11.5" font-weight="600" fill="#868e96">输入：各 rank 独立的向量</text>
    <g transform="translate(16, 58)">
      <rect width="288" height="72" rx="6" fill="#fff5f5" stroke="#ffc9c9" stroke-width="1.2"/>
      <text x="8" y="18" font-size="10.5" fill="#c92a2a" font-family="monospace">rank0: [0, 1, 2, 3]</text>
      <text x="8" y="34" font-size="10.5" fill="#c92a2a" font-family="monospace">rank1: [1, 2, 3, 4]</text>
      <text x="8" y="50" font-size="10.5" fill="#c92a2a" font-family="monospace">rank2: [2, 3, 4, 5]</text>
      <text x="8" y="66" font-size="10.5" fill="#c92a2a" font-family="monospace">rank3: [3, 4, 5, 6]</text>
    </g>

    <!-- 中间箭头 -->
    <text x="160" y="152" text-anchor="middle" font-size="13" fill="#495057">⬇ All-Reduce(SUM) ⬇</text>

    <!-- 输出状态 -->
    <text x="16" y="175" font-size="11.5" font-weight="600" fill="#868e96">输出：所有 rank 得到相同的全局和</text>
    <g transform="translate(16, 183)">
      <rect width="288" height="56" rx="6" fill="#e6fcf5" stroke="#96f2d7" stroke-width="1.2"/>
      <text x="8" y="18" font-size="10.5" fill="#087f5b" font-family="monospace">rank0: [6, 10, 14, 18]</text>
      <text x="8" y="34" font-size="10.5" fill="#087f5b" font-family="monospace">rank1: [6, 10, 14, 18]</text>
      <text x="8" y="50" font-size="10.5" fill="#087f5b" font-family="monospace">rank2/3: [6, 10, 14, 18]</text>
    </g>
  </g>

  <!-- 右侧：Reduce-Scatter + All-Gather -->
  <g transform="translate(380, 55)">
    <rect width="350" height="250" rx="10" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
    <text x="175" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#495057">等价分解：两步完成</text>

    <!-- 步骤 1: Reduce-Scatter -->
    <text x="16" y="50" font-size="11.5" font-weight="600" fill="#1864ab">步骤 1: Reduce-Scatter</text>
    <text x="16" y="66" font-size="10" fill="#868e96">每个 rank 只保留一个分量的全局和</text>
    <g transform="translate(16, 72)">
      <rect width="318" height="56" rx="6" fill="#e7f5ff" stroke="#74c0fc" stroke-width="1.2"/>
      <text x="8" y="18" font-size="10.5" fill="#1864ab" font-family="monospace">rank0: [6]    (第 0 位的全局和)</text>
      <text x="8" y="34" font-size="10.5" fill="#1864ab" font-family="monospace">rank1: [10]   (第 1 位的全局和)</text>
      <text x="8" y="50" font-size="10.5" fill="#1864ab" font-family="monospace">rank2: [14]   rank3: [18]</text>
    </g>

    <!-- 中间箭头 -->
    <text x="175" y="152" text-anchor="middle" font-size="13" fill="#495057">⬇</text>

    <!-- 步骤 2: All-Gather -->
    <text x="16" y="168" font-size="11.5" font-weight="600" fill="#2b8a3e">步骤 2: All-Gather</text>
    <text x="16" y="184" font-size="10" fill="#868e96">所有 rank 收集各分量，拼成完整向量</text>
    <g transform="translate(16, 190)">
      <rect width="318" height="48" rx="6" fill="#e6fcf5" stroke="#96f2d7" stroke-width="1.2"/>
      <text x="8" y="18" font-size="10.5" fill="#087f5b" font-family="monospace">所有 rank: [6, 10, 14, 18]</text>
      <text x="8" y="34" font-size="10.5" fill="#868e96">(拼接了四个 rank 的分片)</text>
    </g>
  </g>

  <!-- 等价符号 -->
  <g transform="translate(360, 160)">
    <circle cx="0" cy="0" r="16" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" font-size="16" font-weight="700" fill="#495057">=</text>
  </g>

  <!-- 底部说明 -->
  <g transform="translate(60, 320)">
    <rect width="640" height="32" rx="7" fill="#fff4e6" stroke="#ffc078" stroke-width="1.3"/>
    <text x="320" y="21" text-anchor="middle" font-size="11" fill="#d9480f">
      数据并行梯度同步用 All-Reduce；FSDP forward 用 All-Gather、backward 用 Reduce-Scatter
    </text>
  </g>
</svg>
