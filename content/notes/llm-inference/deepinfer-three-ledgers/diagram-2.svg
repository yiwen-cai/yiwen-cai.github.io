<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" aria-labelledby="title desc">
<title id="title">提前准备，保留真实依赖</title><desc id="desc">CPU 准备映射与基线可与 GPU 上轮采样重叠。设备修正依赖上轮结果与当前元数据。提交当前 Forward 后，CPU 等待上一轮采样并后处理，可与当前 Forward 重叠。当前采样须等待当前 Forward 及相关准备就绪。区间长度不代表测量。</desc>
<rect x="0" y="0" width="960" height="530" rx="0" fill="#FAF9F5" stroke="none"/><text x="40" y="40" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#655F58" text-anchor="start">02  /  DEEPINFER</text><text x="40" y="80" font-family="Georgia, Songti SC, serif" font-size="29" fill="#141413" text-anchor="start">提前准备，保留真实依赖</text><text x="42" y="127" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#655F58" text-anchor="start">顺序示意 · 非耗时比例</text><text x="58" y="208" font-family="Georgia, Songti SC, serif" font-size="20" fill="#141413" text-anchor="start">CPU</text><text x="58" y="336" font-family="Georgia, Songti SC, serif" font-size="20" fill="#141413" text-anchor="start">GPU</text><line x1="150" y1="240" x2="906" y2="240" stroke="#D8D2C8" stroke-width="1.5"/><line x1="150" y1="368" x2="906" y2="368" stroke="#D8D2C8" stroke-width="1.5"/><rect x="162" y="185" width="170" height="23" rx="0" fill="#E4E0D7" stroke="none"/><text x="247" y="172" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#141413" text-anchor="middle">映射 · 基线</text><rect x="162" y="313" width="140" height="23" rx="0" fill="#D8D2C8" stroke="none"/><text x="232" y="359" font-family="Georgia, Songti SC, serif" font-size="17" fill="#141413" text-anchor="middle">Sample(t−1)</text><line x1="302" y1="325" x2="354" y2="325" stroke="#655F58" stroke-width="1.5"/><line x1="332" y1="208" x2="354" y2="313" stroke="#655F58" stroke-width="1.5" stroke-dasharray="5 6"/><rect x="354" y="313" width="61" height="23" rx="0" fill="#D97757" stroke="none"/><text x="384" y="359" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#141413" text-anchor="middle">修正</text><rect x="445" y="313" width="280" height="23" rx="0" fill="#788C5D" stroke="none"/><text x="585" y="359" font-family="Georgia, Songti SC, serif" font-size="19" fill="#141413" text-anchor="middle">Forward(t)</text><circle cx="445" cy="208" r="4" fill="#D97757"/><line x1="445" y1="215" x2="445" y2="303" stroke="#D97757" stroke-width="1.5" stroke-dasharray="5 6"/><text x="440" y="172" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#141413" text-anchor="middle">提交</text><rect x="487" y="185" width="180" height="23" rx="0" fill="#E8C5B7" stroke="none"/><text x="577" y="172" font-family="Georgia, Songti SC, serif" font-size="17" fill="#141413" text-anchor="middle">PostProcess(t−1)</text><line x1="302" y1="285" x2="487" y2="285" stroke="#655F58" stroke-width="1.5" stroke-dasharray="5 6"/><line x1="302" y1="336" x2="302" y2="285" stroke="#655F58" stroke-width="1.5" stroke-dasharray="5 6"/><line x1="487" y1="285" x2="487" y2="218" stroke="#655F58" stroke-width="1.5" stroke-dasharray="5 6"/><rect x="786" y="313" width="108" height="23" rx="0" fill="#D8D2C8" stroke="none"/><text x="840" y="359" font-family="Georgia, Songti SC, serif" font-size="17" fill="#141413" text-anchor="middle">Sample(t)</text><line x1="725" y1="325" x2="786" y2="325" stroke="#655F58" stroke-width="1.5"/><line x1="667" y1="208" x2="786" y2="303" stroke="#655F58" stroke-width="1.5" stroke-dasharray="5 6"/><line x1="487" y1="416" x2="667" y2="416" stroke="#D97757" stroke-width="3"/><line x1="487" y1="409" x2="487" y2="423" stroke="#D97757" stroke-width="1.5"/><line x1="667" y1="409" x2="667" y2="423" stroke="#D97757" stroke-width="1.5"/><text x="577" y="451" font-family="Georgia, Songti SC, serif" font-size="21" fill="#141413" text-anchor="middle">可重叠</text><text x="480" y="497" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#655F58" text-anchor="middle">后处理等待上一轮采样，不必等待当前 Forward 完成。</text></svg>