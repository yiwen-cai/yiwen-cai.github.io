<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380">
  <!-- 背景 -->
  <rect width="700" height="380" fill="#ffffff"/>
  <defs>
    <marker id="ax-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#868e96" />
    </marker>
    <marker id="euler-vec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1971c2" />
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="350" y="28" text-anchor="middle" font-size="17" font-weight="600" fill="#212529">
    Euler 显式方法的几何直觉与局部截断误差
  </text>

  <!-- 坐标轴 -->
  <line x1="70" y1="300" x2="640" y2="300" stroke="#adb5bd" stroke-width="2" marker-end="url(#ax-arrow)"/>
  <text x="648" y="305" font-size="13" fill="#868e96">t</text>
  
  <line x1="70" y1="300" x2="70" y2="60" stroke="#adb5bd" stroke-width="2" marker-end="url(#ax-arrow)"/>
  <text x="60" y="55" font-size="13" fill="#868e96">X</text>

  <!-- 时间刻度 -->
  <line x1="150" y1="296" x2="150" y2="304" stroke="#868e96" stroke-width="2"/>
  <text x="150" y="322" text-anchor="middle" font-size="14" font-family="monospace" fill="#495057">t</text>
  
  <line x1="480" y1="296" x2="480" y2="304" stroke="#868e96" stroke-width="2"/>
  <text x="480" y="322" text-anchor="middle" font-size="14" font-family="monospace" fill="#495057">t + h</text>
  
  <!-- 步长标注 -->
  <line x1="150" y1="338" x2="480" y2="338" stroke="#868e96" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="150" y1="333" x2="150" y2="343" stroke="#868e96" stroke-width="1.5"/>
  <line x1="480" y1="333" x2="480" y2="343" stroke="#868e96" stroke-width="1.5"/>
  <text x="315" y="356" text-anchor="middle" font-size="13" font-family="monospace" fill="#495057">步长 h</text>

  <!-- 真实曲线（绿色） -->
  <path d="M 150 230 Q 280 165, 480 90" fill="none" stroke="#2b8a3e" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- 真实曲线端点 -->
  <circle cx="480" cy="90" r="7" fill="#2b8a3e" stroke="#ffffff" stroke-width="2.5"/>
  <text x="500" y="86" font-size="14" font-weight="600" fill="#2b8a3e">真实解</text>
  <text x="500" y="104" font-size="13" font-family="monospace" fill="#2b8a3e">X(t+h)</text>

  <!-- Euler 直线步进（蓝色虚线） -->
  <line x1="150" y1="230" x2="472" y2="160" stroke="#1971c2" stroke-width="3" stroke-dasharray="7,4" marker-end="url(#euler-vec)"/>
  
  <!-- Euler 步进端点 -->
  <circle cx="480" cy="158" r="7" fill="#1971c2" stroke="#ffffff" stroke-width="2.5"/>
  <text x="500" y="155" font-size="14" font-weight="600" fill="#1971c2">Euler 近似</text>
  <text x="500" y="173" font-size="13" font-family="monospace" fill="#1971c2">X_t + h·u_t(X_t)</text>

  <!-- 起点 -->
  <circle cx="150" cy="230" r="7" fill="#212529" stroke="#ffffff" stroke-width="2.5"/>
  <text x="120" y="228" text-anchor="end" font-size="14" font-weight="600" font-family="monospace" fill="#212529">X_t</text>

  <!-- 切线方向指示 -->
  <text x="230" y="200" font-size="12" fill="#1971c2" font-style="italic">沿起点切线方向直线外推</text>

  <!-- 误差标注（红色垂直线） -->
  <line x1="480" y1="90" x2="480" y2="158" stroke="#e03131" stroke-width="2.5" stroke-dasharray="4,3"/>
  
  <!-- 误差括号 -->
  <path d="M 490 90 L 496 90 L 496 158 L 490 158" fill="none" stroke="#e03131" stroke-width="1.5"/>
  
  <!-- 误差卡片 -->
  <g transform="translate(190, 60)">
    <rect width="180" height="52" rx="8" fill="#ffe3e3" stroke="#ffa8a8" stroke-width="2"/>
    <text x="90" y="22" text-anchor="middle" font-size="13" font-weight="600" fill="#c92a2a">局部截断误差</text>
    <text x="90" y="41" text-anchor="middle" font-size="14" font-family="monospace" font-weight="600" fill="#c92a2a">O(h²)</text>
  </g>
  
  <!-- 误差指示线 -->
  <path d="M 370 86 Q 420 100, 478 120" fill="none" stroke="#e03131" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- 底部图例与结论 -->
  <g transform="translate(70, 368)">
    <rect width="570" height="0" rx="0" fill="none"/>
  </g>
</svg>
