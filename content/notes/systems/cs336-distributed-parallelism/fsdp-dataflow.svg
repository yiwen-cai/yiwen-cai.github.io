<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420">
  <!-- 背景 -->
  <rect width="700" height="420" fill="#ffffff"/>

  <defs>
    <marker id="fsdp-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#495057" />
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="350" y="28" text-anchor="middle" font-size="17" font-weight="600" fill="#212529">
    FSDP (ZeRO-3) 三阶段数据流
  </text>
  <text x="350" y="47" text-anchor="middle" font-size="11" fill="#868e96">
    参数、梯度、优化器状态全部分片，用通信换显存
  </text>

  <!-- Forward 阶段 -->
  <g transform="translate(30, 62)">
    <rect width="640" height="98" rx="10" fill="#e7f5ff" stroke="#74c0fc" stroke-width="2"/>
    <text x="16" y="24" font-size="14" font-weight="600" fill="#1864ab">Forward（前向）</text>

    <!-- 流程步骤 -->
    <g transform="translate(16, 36)">
      <rect width="132" height="46" rx="6" fill="#ffffff" stroke="#a5d8ff" stroke-width="1.3"/>
      <text x="66" y="19" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1971c2">All-Gather params</text>
      <text x="66" y="34" text-anchor="middle" font-size="9.5" fill="#868e96">收集各卡参数分片</text>
    </g>
    <line x1="156" y1="59" x2="176" y2="59" stroke="#495057" stroke-width="1.8" marker-end="url(#fsdp-a)"/>

    <g transform="translate(180, 36)">
      <rect width="120" height="46" rx="6" fill="#ffffff" stroke="#a5d8ff" stroke-width="1.3"/>
      <text x="60" y="19" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1971c2">拼出完整参数</text>
      <text x="60" y="34" text-anchor="middle" font-size="9.5" fill="#e8590c">（临时占显存）</text>
    </g>
    <line x1="308" y1="59" x2="328" y2="59" stroke="#495057" stroke-width="1.8" marker-end="url(#fsdp-a)"/>

    <g transform="translate(332, 36)">
      <rect width="110" height="46" rx="6" fill="#ffffff" stroke="#a5d8ff" stroke-width="1.3"/>
      <text x="55" y="19" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1971c2">前向计算</text>
      <text x="55" y="34" text-anchor="middle" font-size="9.5" fill="#868e96">逐层执行</text>
    </g>
    <line x1="450" y1="59" x2="470" y2="59" stroke="#495057" stroke-width="1.8" marker-end="url(#fsdp-a)"/>

    <g transform="translate(474, 36)">
      <rect width="134" height="46" rx="6" fill="#ffffff" stroke="#a5d8ff" stroke-width="1.3"/>
      <text x="67" y="19" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2b8a3e">立即释放完整参数</text>
      <text x="67" y="34" text-anchor="middle" font-size="9.5" fill="#868e96">显存峰值可控</text>
    </g>
  </g>

  <!-- Backward 阶段 -->
  <g transform="translate(30, 175)">
    <rect width="640" height="98" rx="10" fill="#fff4e6" stroke="#ffc078" stroke-width="2"/>
    <text x="16" y="24" font-size="14" font-weight="600" fill="#d9480f">Backward（反向）</text>

    <g transform="translate(16, 36)">
      <rect width="132" height="46" rx="6" fill="#ffffff" stroke="#ffd8a8" stroke-width="1.3"/>
      <text x="66" y="19" text-anchor="middle" font-size="10.5" font-weight="600" fill="#e8590c">All-Gather params</text>
      <text x="66" y="34" text-anchor="middle" font-size="9.5" fill="#868e96">反向也需完整参数</text>
    </g>
    <line x1="156" y1="59" x2="176" y2="59" stroke="#495057" stroke-width="1.8" marker-end="url(#fsdp-a)"/>

    <g transform="translate(180, 36)">
      <rect width="120" height="46" rx="6" fill="#ffffff" stroke="#ffd8a8" stroke-width="1.3"/>
      <text x="60" y="19" text-anchor="middle" font-size="10.5" font-weight="600" fill="#e8590c">反向计算</text>
      <text x="60" y="34" text-anchor="middle" font-size="9.5" fill="#868e96">每卡算完整梯度</text>
    </g>
    <line x1="308" y1="59" x2="328" y2="59" stroke="#495057" stroke-width="1.8" marker-end="url(#fsdp-a)"/>

    <g transform="translate(332, 36)">
      <rect width="146" height="46" rx="6" fill="#ffffff" stroke="#ffd8a8" stroke-width="1.3"/>
      <text x="73" y="19" text-anchor="middle" font-size="10.5" font-weight="600" fill="#e8590c">Reduce-Scatter grads</text>
      <text x="73" y="34" text-anchor="middle" font-size="9.5" fill="#868e96">归约 + 分发</text>
    </g>
    <line x1="486" y1="59" x2="506" y2="59" stroke="#495057" stroke-width="1.8" marker-end="url(#fsdp-a)"/>

    <g transform="translate(510, 36)">
      <rect width="98" height="46" rx="6" fill="#ffffff" stroke="#ffd8a8" stroke-width="1.3"/>
      <text x="49" y="19" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2b8a3e">只留自己的</text>
      <text x="49" y="34" text-anchor="middle" font-size="9.5" fill="#868e96">梯度 shard</text>
    </g>
  </g>

  <!-- Optimizer 阶段 -->
  <g transform="translate(30, 288)">
    <rect width="640" height="80" rx="10" fill="#e6fcf5" stroke="#63e6be" stroke-width="2"/>
    <text x="16" y="24" font-size="14" font-weight="600" fill="#087f5b">Optimizer（参数更新）</text>

    <g transform="translate(16, 34)">
      <rect width="200" height="34" rx="6" fill="#ffffff" stroke="#96f2d7" stroke-width="1.3"/>
      <text x="100" y="15" text-anchor="middle" font-size="10.5" font-weight="600" fill="#099268">只对自己的参数 shard 更新</text>
      <text x="100" y="28" text-anchor="middle" font-size="9.5" fill="#868e96">optimizer.step() 局部执行</text>
    </g>
    <line x1="224" y1="51" x2="244" y2="51" stroke="#495057" stroke-width="1.8" marker-end="url(#fsdp-a)"/>

    <g transform="translate(248, 34)">
      <rect width="196" height="34" rx="6" fill="#ffffff" stroke="#96f2d7" stroke-width="1.3"/>
      <text x="98" y="15" text-anchor="middle" font-size="10.5" font-weight="600" fill="#099268">只存自己的优化器状态</text>
      <text x="98" y="28" text-anchor="middle" font-size="9.5" fill="#868e96">Adam m/v 也分片</text>
    </g>
    <line x1="452" y1="51" x2="472" y2="51" stroke="#495057" stroke-width="1.8" marker-end="url(#fsdp-a)"/>

    <g transform="translate(476, 34)">
      <rect width="132" height="34" rx="6" fill="#fff9db" stroke="#ffe066" stroke-width="1.3"/>
      <text x="66" y="15" text-anchor="middle" font-size="10.5" font-weight="600" fill="#e67700">显存 ≈ 1/N</text>
      <text x="66" y="28" text-anchor="middle" font-size="9.5" fill="#868e96">N = 卡数</text>
    </g>
  </g>

  <!-- 底部权衡说明 -->
  <text x="350" y="392" text-anchor="middle" font-size="11" fill="#495057">
    核心权衡：显存从 O(model) 降到 O(model/N)，代价是每层前后都要通信
  </text>
  <text x="350" y="410" text-anchor="middle" font-size="10.5" fill="#868e96">
    实践中靠 prefetch 把 All-Gather 与计算重叠，隐藏通信延迟
  </text>
</svg>
