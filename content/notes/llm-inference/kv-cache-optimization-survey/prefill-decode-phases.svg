<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330">
  <!-- 背景 -->
  <rect width="720" height="330" fill="#ffffff"/>

  <defs>
    <marker id="pd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#495057" />
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="600" fill="#212529">
    自回归推理的两阶段：Prefill 与 Decode
  </text>

  <!-- 输入 -->
  <g transform="translate(30, 50)">
    <rect width="130" height="46" rx="8" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/>
    <text x="65" y="21" text-anchor="middle" font-size="12.5" font-weight="600" fill="#495057">Prompt tokens</text>
    <text x="65" y="37" text-anchor="middle" font-size="10" fill="#868e96">用户输入序列</text>
  </g>

  <line x1="168" y1="73" x2="192" y2="73" stroke="#495057" stroke-width="2" marker-end="url(#pd-arrow)"/>

  <!-- Prefill 阶段 -->
  <g transform="translate(196, 44)">
    <rect width="490" height="58" rx="8" fill="#fff5f5" stroke="#ffa8a8" stroke-width="2"/>
    <text x="14" y="22" font-size="13" font-weight="600" fill="#c92a2a">Prefill 阶段</text>
    <text x="112" y="22" font-size="10.5" fill="#e03131">并行处理全部 prompt token，一次性构建 KV Cache</text>
    <g transform="translate(14, 30)">
      <rect width="120" height="20" rx="4" fill="#ffe3e3" stroke="#ffc9c9" stroke-width="1"/>
      <text x="60" y="14" text-anchor="middle" font-size="10" font-weight="600" fill="#c92a2a">compute-bound</text>
    </g>
      <text x="146" y="44" font-size="10" fill="#868e96">算力是瓶颈，GPU 利用率高</text>
  </g>

  <!-- 向下箭头 -->
  <line x1="360" y1="106" x2="360" y2="126" stroke="#495057" stroke-width="2" marker-end="url(#pd-arrow)"/>

  <!-- Decode 阶段容器 -->
  <g transform="translate(90, 130)">
    <rect width="560" height="150" rx="10" fill="#e7f5ff" stroke="#74c0fc" stroke-width="2"/>
    <text x="16" y="24" font-size="13" font-weight="600" fill="#1864ab">Decode 阶段（逐 token 串行）</text>
    <g transform="translate(240, 10)">
      <rect width="180" height="20" rx="4" fill="#d0ebff" stroke="#a5d8ff" stroke-width="1"/>
      <text x="90" y="14" text-anchor="middle" font-size="10" font-weight="600" fill="#1864ab">memory-bandwidth-bound</text>
    </g>

    <!-- Decode step 1 -->
    <g transform="translate(16, 34)">
      <rect width="528" height="32" rx="6" fill="#ffffff" stroke="#a5d8ff" stroke-width="1.3"/>
      <text x="10" y="20" font-size="10.5" font-weight="600" fill="#1971c2">Step 1</text>
      <text x="62" y="20" font-size="10.5" fill="#495057">读 cache → 生成 token 1 → 追加新 KV 到 cache</text>
    </g>

    <!-- Decode step 2 -->
    <g transform="translate(36, 72)">
      <rect width="508" height="32" rx="6" fill="#ffffff" stroke="#a5d8ff" stroke-width="1.3"/>
      <text x="10" y="20" font-size="10.5" font-weight="600" fill="#1971c2">Step 2</text>
      <text x="62" y="20" font-size="10.5" fill="#495057">读更新后的 cache → 生成 token 2 → 再次追加</text>
    </g>

    <!-- 省略号 -->
    <text x="76" y="128" font-size="13" fill="#868e96">⋮</text>
    <text x="96" y="128" font-size="10.5" fill="#868e96">每步 cache 变长，读取量线性增长，直到生成结束</text>
  </g>

  <!-- 底部关键对比 -->
  <g transform="translate(90, 292)">
    <rect width="560" height="30" rx="7" fill="#fff4e6" stroke="#ffc078" stroke-width="1.4"/>
    <text x="280" y="19" text-anchor="middle" font-size="11" fill="#d9480f">
      KV Cache 用显存换重复计算：省下算力，但把瓶颈转移到显存容量与带宽
    </text>
  </g>
</svg>
