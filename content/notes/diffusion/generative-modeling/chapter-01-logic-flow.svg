<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1100" width="600" height="1100">
  <!-- 背景 -->
  <rect width="600" height="1100" fill="#ffffff"/>
  
  <!-- 定义箭头 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1e1e1e" />
    </marker>
  </defs>
  
  <!-- 步骤 1: 真实对象 -->
  <rect x="210" y="50" width="180" height="80" rx="10" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
  <text x="300" y="80" text-anchor="middle" font-size="18" font-weight="600" fill="#1e1e1e">真实对象</text>
  <text x="300" y="105" text-anchor="middle" font-size="16" fill="#495057">图像、视频、分子</text>
  
  <!-- 箭头 1 -->
  <line x1="300" y1="130" x2="300" y2="190" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="320" y="165" font-size="14" fill="#495057">数值化</text>
  
  <!-- 步骤 2: 向量表示 -->
  <rect x="210" y="190" width="180" height="80" rx="10" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
  <text x="300" y="220" text-anchor="middle" font-size="18" font-weight="600" fill="#1e1e1e">向量表示</text>
  <text x="300" y="245" text-anchor="middle" font-size="16" fill="#495057">z ∈ ℝᵈ</text>
  
  <!-- 箭头 2 -->
  <line x1="300" y1="270" x2="300" y2="330" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="320" y="305" font-size="14" fill="#495057">抽象化</text>
  
  <!-- 步骤 3: 未知数据分布 -->
  <rect x="210" y="330" width="180" height="80" rx="10" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
  <text x="300" y="360" text-anchor="middle" font-size="18" font-weight="600" fill="#1e1e1e">未知数据分布</text>
  <text x="300" y="385" text-anchor="middle" font-size="16" fill="#495057">p_data</text>
  
  <!-- 箭头 3 -->
  <line x1="300" y1="410" x2="300" y2="470" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="320" y="445" font-size="14" fill="#495057">采样</text>
  
  <!-- 步骤 4: 有限数据集 -->
  <rect x="210" y="470" width="180" height="80" rx="10" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
  <text x="300" y="500" text-anchor="middle" font-size="18" font-weight="600" fill="#1e1e1e">有限数据集</text>
  <text x="300" y="525" text-anchor="middle" font-size="16" fill="#495057">z₁, …, zₙ</text>
  
  <!-- 箭头 4 -->
  <line x1="300" y1="550" x2="300" y2="610" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="320" y="585" font-size="14" fill="#495057">训练</text>
  
  <!-- 步骤 5: 生成模型 -->
  <rect x="210" y="610" width="180" height="80" rx="10" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/>
  <text x="300" y="655" text-anchor="middle" font-size="18" font-weight="600" fill="#1e1e1e">生成模型</text>
  
  <!-- 分支箭头到无条件生成 -->
  <path d="M 210 650 Q 150 750 150 850" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 分支箭头到条件生成 -->
  <path d="M 390 650 Q 450 750 450 850" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 步骤 6a: 无条件生成 -->
  <rect x="50" y="850" width="200" height="80" rx="10" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
  <text x="150" y="880" text-anchor="middle" font-size="18" font-weight="600" fill="#1e1e1e">无条件生成</text>
  <text x="150" y="905" text-anchor="middle" font-size="16" fill="#495057">z ~ p_data</text>
  
  <!-- 条件 y -->
  <rect x="390" y="730" width="120" height="60" rx="10" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
  <text x="450" y="765" text-anchor="middle" font-size="16" font-weight="600" fill="#1e1e1e">条件 y</text>
  
  <!-- 条件箭头 -->
  <line x1="450" y1="790" x2="450" y2="850" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  
  <!-- 步骤 6b: 条件生成 -->
  <rect x="350" y="850" width="200" height="80" rx="10" fill="#c3fae8" stroke="#1e1e1e" stroke-width="2"/>
  <text x="450" y="880" text-anchor="middle" font-size="18" font-weight="600" fill="#1e1e1e">条件生成</text>
  <text x="450" y="905" text-anchor="middle" font-size="16" fill="#495057">z ~ p_data(·|y)</text>
</svg>
