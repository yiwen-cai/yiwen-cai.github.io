<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340">
  <!-- 背景 -->
  <rect width="560" height="340" fill="#ffffff"/>

  <defs>
    <marker id="mla-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#495057" />
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="280" y="28" text-anchor="middle" font-size="17" font-weight="600" fill="#212529">
    MLA：缓存 Latent State 而非完整 K/V
  </text>
  <text x="280" y="47" text-anchor="middle" font-size="10.5" fill="#868e96">
    从架构层降维，用 up/down projection 解耦表示与存储
  </text>

  <!-- 输入 -->
  <g transform="translate(190, 64)">
    <rect width="180" height="42" rx="7" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/>
    <text x="90" y="20" text-anchor="middle" font-size="12" font-weight="600" fill="#495057">Hidden state</text>
    <text x="90" y="34" text-anchor="middle" font-size="10" fill="#868e96">原始高维表示（如 4096）</text>
  </g>

  <line x1="280" y1="110" x2="280" y2="130" stroke="#495057" stroke-width="2" marker-end="url(#mla-arrow)"/>
  <text x="300" y="122" font-size="10" font-weight="600" fill="#e8590c">down projection</text>

  <!-- Latent state（核心缓存） -->
  <g transform="translate(170, 134)">
    <rect width="220" height="54" rx="8" fill="#fff4e6" stroke="#ffc078" stroke-width="2.5"/>
    <text x="110" y="22" text-anchor="middle" font-size="13" font-weight="600" fill="#d9480f">低维 latent state</text>
    <text x="110" y="38" text-anchor="middle" font-size="10.5" fill="#495057">缓存这个（如 512 维）</text>
  </g>

  <!-- 强调符号 -->
  <text x="28" y="164" font-size="24" fill="#e8590c">←</text>
  <g transform="translate(32, 146)">
    <rect width="120" height="38" rx="6" fill="#fff9db" stroke="#ffe066" stroke-width="1.5"/>
    <text x="60" y="16" text-anchor="middle" font-size="10.5" font-weight="600" fill="#e67700">KV Cache 存这里</text>
    <text x="60" y="30" text-anchor="middle" font-size="9.5" fill="#868e96">显存降 8× 甚至更多</text>
  </g>

  <line x1="280" y1="192" x2="280" y2="212" stroke="#495057" stroke-width="2" marker-end="url(#mla-arrow)"/>
  <text x="300" y="204" font-size="10" font-weight="600" fill="#1971c2">up projection</text>
  <text x="160" y="204" font-size="9.5" fill="#868e96">attention 计算时按需还原</text>

  <!-- 还原 K/V -->
  <g transform="translate(190, 216)">
    <rect width="180" height="42" rx="7" fill="#e7f5ff" stroke="#74c0fc" stroke-width="2"/>
    <text x="90" y="20" text-anchor="middle" font-size="12" font-weight="600" fill="#1864ab">完整 K 和 V</text>
    <text x="90" y="34" text-anchor="middle" font-size="10" fill="#495057">还原到原维度，用于 attention</text>
  </g>

  <!-- 对比表 -->
  <g transform="translate(60, 276)">
    <rect width="440" height="54" rx="7" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.3"/>
    <text x="14" y="18" font-size="10.5" font-weight="600" fill="#495057">传统 GQA：</text>
    <text x="90" y="18" font-size="10" fill="#868e96">直接存完整 K/V，每层每 head 占 T × D<tspan font-size="7.5" dy="2">h</tspan><tspan dy="-2"> 显存</tspan></text>
    
    <text x="14" y="36" font-size="10.5" font-weight="600" fill="#495057">MLA 方案：</text>
    <text x="90" y="36" font-size="10" fill="#868e96">只存压缩后 latent，显存降到 T × D<tspan font-size="7.5" dy="2">latent</tspan></text>
    
    <text x="14" y="48" font-size="9.5" fill="#e03131">代价：训练阶段需架构支持，不能后装到任意模型</text>
  </g>
</svg>
