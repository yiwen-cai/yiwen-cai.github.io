<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360">
  <rect width="760" height="360" fill="#ffffff"/>
  <defs>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#495057" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1971c2" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b8a3e" />
    </marker>
  </defs>

  <text x="380" y="26" text-anchor="middle" font-size="16" font-weight="600" fill="#212529">
    SGLang 三进程 ZeroMQ 环形拓扑与 Overlap Scheduling 双缓冲流水
  </text>

  <!-- 上半部：三进程 ZMQ 环 -->
  <g transform="translate(28, 44)">
    <rect width="205" height="96" rx="8" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1.8"/>
    <text x="102" y="22" text-anchor="middle" font-size="12.5" font-weight="600" fill="#212529">Process 1 · HTTP &amp; Tokenizer</text>
    <text x="102" y="42" text-anchor="middle" font-size="10.5" fill="#495057">FastAPI / Uvicorn + TokenizerManager</text>
    <text x="102" y="60" text-anchor="middle" font-size="10" fill="#868e96">持有全部客户端 SSE 长连接</text>
    <text x="102" y="78" text-anchor="middle" font-size="10" fill="#1971c2" font-weight="600">突发万级连接仅占 CPU 内存</text>
  </g>

  <line x1="235" y1="78" x2="275" y2="78" stroke="#1971c2" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="255" y="68" text-anchor="middle" font-size="9.5" fill="#1971c2">ZMQ IPC</text>

  <g transform="translate(278, 44)">
    <rect width="225" height="96" rx="8" fill="#e7f5ff" stroke="#74c0fc" stroke-width="2"/>
    <text x="112" y="22" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1864ab">Process 2 · Scheduler (1/GPU)</text>
    <text x="112" y="42" text-anchor="middle" font-size="10.5" fill="#1971c2">recv_pyobj(NOBLOCK) 排空收件箱</text>
    <text x="112" y="60" text-anchor="middle" font-size="10" fill="#495057">RadixCache 匹配 + Page=1 槽位分配</text>
    <text x="112" y="78" text-anchor="middle" font-size="10" fill="#c92a2a" font-weight="600">ScheduleBatch → ForwardBatch → GPU</text>
  </g>

  <line x1="505" y1="78" x2="545" y2="78" stroke="#1971c2" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="525" y="68" text-anchor="middle" font-size="9.5" fill="#1971c2">Token IDs</text>

  <g transform="translate(548, 44)">
    <rect width="184" height="96" rx="8" fill="#ebfbee" stroke="#8ce99a" stroke-width="1.8"/>
    <text x="92" y="22" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2b8a3e">Process 3 · Detokenizer</text>
    <text x="92" y="42" text-anchor="middle" font-size="10.5" fill="#2f9e44">DetokenizerManager</text>
    <text x="92" y="60" text-anchor="middle" font-size="10" fill="#495057">增量解码 Token ID → UTF-8</text>
    <text x="92" y="78" text-anchor="middle" font-size="10" fill="#2b8a3e" font-weight="600">BatchStrOutput 回传 SSE</text>
  </g>

  <path d="M 640 140 L 640 156 L 130 156 L 130 142" fill="none" stroke="#2b8a3e" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
  <text x="385" y="153" text-anchor="middle" font-size="9.5" fill="#2b8a3e">ZMQ PUSH/PULL: BatchStrOutput → OpenAI SSE Stream (data: ...)</text>

  <!-- 下半部：Overlap Scheduling 时间线对比 -->
  <g transform="translate(28, 174)">
    <rect width="704" height="170" rx="10" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
    <text x="16" y="24" font-size="12.5" font-weight="600" fill="#212529">event_loop_normal（串行，存在 GPU 空闲气泡） vs event_loop_overlap（双缓冲重叠，GPU 100% 满载）</text>

    <!-- Normal -->
    <text x="16" y="54" font-size="11" font-weight="600" fill="#868e96">Normal</text>
    <rect x="82" y="38" width="90" height="24" rx="4" fill="#ffe3e3" stroke="#ffa8a8"/>
    <text x="127" y="54" text-anchor="middle" font-size="10" fill="#c92a2a">CPU Step t</text>
    <rect x="174" y="38" width="160" height="24" rx="4" fill="#d0ebff" stroke="#74c0fc"/>
    <text x="254" y="54" text-anchor="middle" font-size="10" fill="#1864ab">GPU Forward + Sample t</text>
    <rect x="336" y="38" width="90" height="24" rx="4" fill="#fff4e6" stroke="#ffc078" stroke-dasharray="3,2"/>
    <text x="381" y="54" text-anchor="middle" font-size="10" fill="#d9480f">GPU 气泡 (等 CPU)</text>
    <rect x="428" y="38" width="160" height="24" rx="4" fill="#d0ebff" stroke="#74c0fc"/>
    <text x="508" y="54" text-anchor="middle" font-size="10" fill="#1864ab">GPU Forward + Sample t+1</text>

    <!-- Overlap -->
    <text x="16" y="98" font-size="11" font-weight="600" fill="#1864ab">Overlap</text>
    <text x="16" y="114" font-size="9.5" fill="#495057">(CPU / GPU)</text>
    <rect x="82" y="76" width="90" height="22" rx="4" fill="#ffe3e3" stroke="#ffa8a8"/>
    <text x="127" y="91" text-anchor="middle" font-size="9.5" fill="#c92a2a">CPU 准备 Step t</text>
    <rect x="174" y="76" width="110" height="22" rx="4" fill="#ffe3e3" stroke="#ffa8a8"/>
    <text x="229" y="91" text-anchor="middle" font-size="9.5" fill="#c92a2a">CPU 提前准备 Step t+1</text>
    <rect x="286" y="76" width="66" height="22" rx="4" fill="#ebfbee" stroke="#8ce99a"/>
    <text x="319" y="91" text-anchor="middle" font-size="9.5" fill="#2b8a3e">处理结果 t</text>

    <rect x="174" y="104" width="178" height="26" rx="4" fill="#1971c2"/>
    <text x="263" y="121" text-anchor="middle" font-size="10.5" font-weight="600" fill="#ffffff">GPU Forward + Sample Step t</text>
    <rect x="354" y="104" width="178" height="26" rx="4" fill="#1864ab"/>
    <text x="443" y="121" text-anchor="middle" font-size="10.5" font-weight="600" fill="#ffffff">GPU Forward + Sample Step t+1</text>

    <path d="M 336 130 Q 354 148 372 130" fill="none" stroke="#d9480f" stroke-width="1.8" marker-end="url(#arr-dark)"/>
    <text x="380" y="154" text-anchor="middle" font-size="10.5" fill="#d9480f" font-weight="600">
      核心机制：CPU 分配页表仅依赖序列长度 (seq_len+1)，采样出的 Token ID 留在 GPU future_token_ids_map 直供下一步读取
    </text>
  </g>
</svg>
