<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <!-- 背景 -->
  <rect width="640" height="400" fill="#ffffff"/>
  
  <defs>
    <marker id="mem-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#868e96" />
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="320" y="30" text-anchor="middle" font-size="17" font-weight="600" fill="#212529">
    GPU 内存层次：速度与容量的权衡
  </text>

  <!-- 左侧：速度轴 -->
  <text x="52" y="72" text-anchor="middle" font-size="12" font-weight="600" fill="#2b8a3e">快</text>
  <line x1="52" y1="82" x2="52" y2="330" stroke="#adb5bd" stroke-width="2" marker-end="url(#mem-arrow)"/>
  <text x="52" y="352" text-anchor="middle" font-size="12" font-weight="600" fill="#c92a2a">慢</text>
  <text x="22" y="210" text-anchor="middle" font-size="12" fill="#868e96" transform="rotate(-90, 22, 210)">访问速度</text>

  <!-- 右侧：容量轴 -->
  <text x="600" y="72" text-anchor="middle" font-size="12" font-weight="600" fill="#c92a2a">小</text>
  <line x1="600" y1="82" x2="600" y2="330" stroke="#adb5bd" stroke-width="2" marker-end="url(#mem-arrow)"/>
  <text x="600" y="352" text-anchor="middle" font-size="12" font-weight="600" fill="#2b8a3e">大</text>
  <text x="628" y="210" text-anchor="middle" font-size="12" fill="#868e96" transform="rotate(-90, 628, 210)">存储容量</text>

  <!-- 层级 1: Registers (最窄) -->
  <g transform="translate(230, 62)">
    <rect width="180" height="48" rx="8" fill="#d3f9d8" stroke="#40c057" stroke-width="2"/>
    <text x="90" y="21" text-anchor="middle" font-size="13" font-weight="600" fill="#2b8a3e">Registers</text>
    <text x="90" y="38" text-anchor="middle" font-size="11" fill="#495057">thread 私有 · 最快</text>
  </g>
  <line x1="320" y1="112" x2="320" y2="126" stroke="#868e96" stroke-width="2" marker-end="url(#mem-arrow)"/>

  <!-- 层级 2: Shared Memory / L1 -->
  <g transform="translate(200, 128)">
    <rect width="240" height="48" rx="8" fill="#e7f5ff" stroke="#4dabf7" stroke-width="2"/>
    <text x="120" y="21" text-anchor="middle" font-size="13" font-weight="600" fill="#1864ab">Shared Memory / L1 Cache</text>
    <text x="120" y="38" text-anchor="middle" font-size="11" fill="#495057">block 内共享 · 适合 tile 复用</text>
  </g>
  <line x1="320" y1="178" x2="320" y2="192" stroke="#868e96" stroke-width="2" marker-end="url(#mem-arrow)"/>

  <!-- 层级 3: L2 Cache -->
  <g transform="translate(170, 194)">
    <rect width="300" height="48" rx="8" fill="#fff4e6" stroke="#ff922b" stroke-width="2"/>
    <text x="150" y="21" text-anchor="middle" font-size="13" font-weight="600" fill="#d9480f">L2 Cache</text>
    <text x="150" y="38" text-anchor="middle" font-size="11" fill="#495057">GPU 全局 · 所有 SM 共享</text>
  </g>
  <line x1="320" y1="244" x2="320" y2="258" stroke="#868e96" stroke-width="2" marker-end="url(#mem-arrow)"/>

  <!-- 层级 4: HBM (最宽) -->
  <g transform="translate(130, 260)">
    <rect width="380" height="60" rx="8" fill="#ffe3e3" stroke="#fa5252" stroke-width="2"/>
    <text x="190" y="24" text-anchor="middle" font-size="13" font-weight="600" fill="#c92a2a">HBM / Global Memory（显存）</text>
    <text x="190" y="42" text-anchor="middle" font-size="11" fill="#495057">容量最大 · 带宽高但延迟远高于片上内存</text>
  </g>

  <!-- 底部核心原则 -->
  <g transform="translate(90, 340)">
    <rect width="460" height="46" rx="8" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
    <text x="230" y="19" text-anchor="middle" font-size="12" font-weight="600" fill="#495057">核心优化原则</text>
    <text x="230" y="36" text-anchor="middle" font-size="11" fill="#495057">
      一次从 HBM 读入的数据，应在 register / shared memory 中尽可能多次复用
    </text>
  </g>
</svg>
